<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinese Film Week - Ticket Scanner</title>
    <!-- PWA App 配置 -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#c0392b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <style>
        :root {
            --primary-color: #c0392b;
            --primary-hover: #e74c3c;
            --accent-color: #f1c40f;
            --bg-color: #f7f9fc;
            --card-bg: #ffffff;
            --text-color: #2f3542;
            --border-color: #dfe4ea;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #2c0b0e 0%, #110203 100%);
            color: var(--text-color);
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
            position: relative;
            color: #fff;
        }

        header h1 {
            font-size: 24px;
            color: var(--accent-color);
            margin-bottom: 6px;
        }

        header p {
            color: #dcdde1;
            font-size: 13px;
        }

        .home-link {
            position: absolute;
            top: 0;
            left: 0;
            font-size: 13px;
            color: #fff;
            text-decoration: none;
            background: rgba(255,255,255,0.2);
            padding: 6px 10px;
            border-radius: 6px;
            transition: background 0.2s;
        }

        .home-link:hover {
            background: rgba(255,255,255,0.4);
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
            border-top: 4px solid var(--primary-color);
        }

        .card h2 {
            font-size: 18px;
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--bg-color);
            color: #2c0b0e;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 6px;
            color: #2f3542;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--primary-color);
        }

        .btn {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-bottom: 10px;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn-camera {
            background-color: #2c0b0e;
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
        }
        .btn-camera:hover {
            background-color: #4a151b;
        }

        #reader {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 15px;
            display: none;
        }

        .result-box {
            margin-top: 15px;
            padding: 18px;
            border-radius: 8px;
            background: #f1f2f6;
            display: none;
        }

        .result-box.success {
            background: #e8f8f5;
            border: 2px solid #2ed573;
        }

        .result-box.error {
            background: #fdebd0;
            border: 2px solid #ff4757;
        }

        .result-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .result-item {
            font-size: 14px;
            margin-bottom: 8px;
            color: #2f3542;
        }

        .result-item span {
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <a href="index.html" class="home-link">⬅️ Booking</a>
        <h1>🇨🇳 🇴🇲 Mobile Ticket Scanner</h1>
        <p>Scan attendee QR codes or verify by Booking ID</p>
    </header>

    <div class="card">
        <h2>Verification Portal</h2>

        <button type="button" id="toggleCameraBtn" class="btn btn-camera" onclick="toggleCamera()">📷 Start Camera Scan</button>
        
        <div id="reader"></div>

        <form id="scanForm">
            <div class="form-group">
                <label for="bookingIdInput">Or Enter Booking ID manually</label>
                <input type="text" id="bookingIdInput" autocomplete="off" placeholder="Type booking ID (e.g. FWXXXXXX)...">
            </div>
            <button type="submit" class="btn">Verify by ID</button>
        </form>

        <div id="resultBox" class="result-box">
            <div id="resultTitle" class="result-title"></div>
            <div id="resultContent"></div>
        </div>
    </div>
</div>

<script>
    const scanForm = document.getElementById('scanForm');
    const resultBox = document.getElementById('resultBox');
    const resultTitle = document.getElementById('resultTitle');
    const resultContent = document.getElementById('resultContent');
    const toggleCameraBtn = document.getElementById('toggleCameraBtn');
    const readerDiv = document.getElementById('reader');

    let html5QrCode = null;
    let cameraIsRunning = false;

    function verifyTicketCode(code) {
        const inputId = code.trim().toUpperCase();
        if (!inputId) return;

        const records = JSON.parse(localStorage.getItem('cinema_bookings')) || [];
        const foundRecord = records.find(r => r.bookingId === inputId);

        resultBox.style.display = 'block';

        if (foundRecord) {
            resultBox.className = 'result-box success';
            resultTitle.innerHTML = '✅ VALID TICKET / 核验通过';
            const seatsStr = Array.isArray(foundRecord.seats) ? foundRecord.seats.join(', ') : foundRecord.seat;
            
            resultContent.innerHTML = `
                <div class="result-item">Booking ID: <span>${foundRecord.bookingId}</span></div>
                <div class="result-item">Attendee Name: <span>${foundRecord.name}</span></div>
                <div class="result-item">Screening Session: <span>${foundRecord.movie}</span></div>
                <div class="result-item">Assigned Seats: <span style="color:#0288d1; font-size:16px;">${seatsStr}</span></div>
                <div class="result-item">ID Type & Number: <span>${foundRecord.idType} - ${foundRecord.idNumber}</span></div>
                <div class="result-item">Phone: <span>${foundRecord.phone}</span></div>
                <div class="result-item">Registered Time: <span>${foundRecord.time}</span></div>
            `;
        } else {
            resultBox.className = 'result-box error';
            resultTitle.innerHTML = '❌ INVALID TICKET / 无效的预订码';
            resultContent.innerHTML = `
                <div class="result-item" style="color: #ff4757;">No booking record found matching: <strong>${inputId}</strong></div>
            `;
        }
    }

    scanForm.addEventListener('submit', function(e) {
        e.preventDefault();
        const inputId = document.getElementById('bookingIdInput').value;
        verifyTicketCode(inputId);
        document.getElementById('bookingIdInput').value = '';
    });

    function toggleCamera() {
        if (!cameraIsRunning) {
            readerDiv.style.display = 'block';
            toggleCameraBtn.innerText = "🛑 Stop Camera";
            toggleCameraBtn.style.backgroundColor = "#c0392b";
            toggleCameraBtn.style.color = "#ffffff";

            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                { facingMode: "environment" },
                {
                    fps: 10,
                    qrbox: { width: 250, height: 250 }
                },
                (decodedText, decodedResult) => {
                    verifyTicketCode(decodedText);
                },
                (errorMessage) => {}
            ).catch(err => {
                alert("Unable to access camera. Please check camera permission.");
                stopCameraState();
            });

            cameraIsRunning = true;
        } else {
            stopCameraScan();
        }
    }

    function stopCameraScan() {
        if (html5QrCode && cameraIsRunning) {
            html5QrCode.stop().then(() => {
                stopCameraState();
            }).catch(err => {
                stopCameraState();
            });
        } else {
            stopCameraState();
        }
    }

    function stopCameraState() {
        cameraIsRunning = false;
        readerDiv.style.display = 'none';
        toggleCameraBtn.innerText = "📷 Start Camera Scan";
        toggleCameraBtn.style.backgroundColor = "#2c0b0e";
        toggleCameraBtn.style.color = "#f1c40f";
    }
</script>

</body>
</html>
