<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinese Film Week in Oman - Ticket Scanner</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        :root {
            --primary-color: #c0392b;
            --accent-color: #f1c40f;
            --bg-color: #f7f9fc;
            --card-bg: #ffffff;
            --text-color: #2f3542;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #2c0b0e 0%, #110203 100%);
            color: var(--text-color);
            padding: 15px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            color: #fff;
        }

        header h1 {
            font-size: 20px;
            color: var(--accent-color);
            margin-bottom: 4px;
        }

        header p {
            color: #dcdde1;
            font-size: 12px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 18px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
            border-top: 4px solid var(--primary-color);
        }

        .card h2 {
            font-size: 16px;
            margin-bottom: 12px;
            color: #2c0b0e;
        }

        #reader {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            border: 2px dashed #dfe4ea;
        }

        .result-box {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            background: var(--bg-color);
            text-align: center;
        }

        .result-box.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            font-weight: bold;
        }

        .result-box.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            font-weight: bold;
        }

        .manual-input {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        input {
            flex: 1;
            padding: 10px;
            border: 1px solid #dfe4ea;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        button {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }

        button:hover {
            background: #e74c3c;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Ticket Scanner & Verifier</h1>
        <p>Chinese Film Week in Oman | Cinema 5, VOX Cinemas</p>
    </header>

    <div class="card">
        <h2>Scan QR Code</h2>
        <div id="reader"></div>
        <div id="scanResult" class="result-box">Please point camera at attendee's ticket QR code</div>
    </div>

    <div class="card">
        <h2>Or Verify Manually by Booking ID</h2>
        <div class="manual-input">
            <input type="text" id="manualId" placeholder="Enter Booking ID (e.g. FWXXXX)">
            <button onclick="verifyManualTicket()">Verify</button>
        </div>
        <div id="manualResult" class="result-box" style="margin-top: 10px; display: none;"></div>
    </div>
</div>

<script>
    // 绑定您的专属云端存储凭证
    const BIN_ID = '6ad37fdfffd5d16053739f05';
    const API_KEY = '$2a$10$Ct25jThXL/UfCmIRxWPPreSccnK4cMEmk4vpob9.GbZtRTEb3PXQu';

    // 从云端获取所有预订订单
    async function fetchCloudBookings() {
        try {
            const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                headers: { 'X-Master-Key': API_KEY }
            });
            const data = await response.json();
            return data.record.bookings || [];
        } catch (e) {
            console.error('Failed to fetch bookings from cloud', e);
            return [];
        }
    }

    // 验证票务核心逻辑
    async function verifyTicketCode(bookingId) {
        const cleanedId = bookingId.trim().toUpperCase();
        const bookings = await fetchCloudBookings();
        
        const matchedTicket = bookings.find(r => r.bookingId.toUpperCase() === cleanedId);

        return {
            found: !!matchedTicket,
            ticket: matchedTicket
        };
    }

    // 初始化相机扫码
    function onScanSuccess(decodedText, decodedResult) {
        // 暂停或处理扫描结果
        document.getElementById('scanResult').innerHTML = `Scanning... Verifying ID: <b>${decodedText}</b>`;
        
        verifyTicketCode(decodedText).then(res => {
            const resultBox = document.getElementById('scanResult');
            if (res.found) {
                const t = res.ticket;
                const seatsStr = Array.isArray(t.seats) ? t.seats.join(', ') : t.seat;
                resultBox.className = 'result-box success';
                resultBox.innerHTML = `✅ VALID TICKET!<br>
                    <strong>Attendee:</strong> ${t.name} (${t.nationality})<br>
                    <strong>Movie:</strong> ${t.movie}<br>
                    <strong>Seats:</strong> ${seatsStr}<br>
                    <strong>Phone:</strong> ${t.phone}`;
            } else {
                resultBox.className = 'result-box error';
                resultBox.innerHTML = `❌ INVALID TICKET! Booking ID "${decodedText}" not found in cloud database.`;
            }
        });
    }

    async function verifyManualTicket() {
        const inputId = document.getElementById('manualId').value;
        const resultBox = document.getElementById('manualResult');
        resultBox.style.display = 'block';

        if (!inputId) {
            resultBox.className = 'result-box error';
            resultBox.innerText = 'Please enter a Booking ID';
            return;
        }

        resultBox.className = 'result-box';
        resultBox.innerText = 'Checking cloud database...';

        const res = await verifyTicketCode(inputId);
        if (res.found) {
            const t = res.ticket;
            const seatsStr = Array.isArray(t.seats) ? t.seats.join(', ') : t.seat;
            resultBox.className = 'result-box success';
            resultBox.innerHTML = `✅ VALID TICKET!<br>
                <strong>Attendee:</strong> ${t.name} (${t.nationality})<br>
                <strong>Movie:</strong> ${t.movie}<br>
                <strong>Seats:</strong> ${seatsStr}<br>
                <strong>Phone:</strong> ${t.phone}`;
        } else {
            resultBox.className = 'result-box error';
            resultBox.innerHTML = `❌ INVALID TICKET! Booking ID "${inputId}" not found.`;
        }
    }

    let html5QrcodeScanner = new Html5QrcodeScanner(
        "reader", { fps: 10, qrbox: 250 }
    );
    html5QrcodeScanner.render(onScanSuccess, (err) => {
        // 忽略常规未扫到码时的扫描帧错误
    });
</script>

</body>
</html>
