<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinese Film Week in Oman - Booking</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#c0392b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --primary-color: #c0392b;
            --primary-hover: #e74c3c;
            --accent-color: #f1c40f;
            --bg-color: #f7f9fc;
            --card-bg: #ffffff;
            --text-color: #2f3542;
            --border-color: #dfe4ea;
            --seat-available: #ced6e0;
            --seat-selected: #2ed573;
            --seat-occupied: #c0392b;
            --seat-disabled: #ffa502;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #2c0b0e 0%, #110203 100%);
            color: var(--text-color);
            padding: 15px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            color: #fff;
        }

        header h1 {
            font-size: 22px;
            color: var(--accent-color);
            margin-bottom: 6px;
        }

        header p {
            color: #dcdde1;
            font-size: 12px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 18px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
            border-top: 4px solid var(--primary-color);
        }

        .card h2 {
            font-size: 17px;
            margin-bottom: 14px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--bg-color);
            color: #2c0b0e;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
            color: #2f3542;
        }

        input, select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--primary-color);
        }

        .screen-container {
            text-align: center;
            margin-bottom: 12px;
        }

        .screen {
            background: #2c0b0e;
            color: var(--accent-color);
            padding: 6px;
            border-radius: 4px;
            font-size: 12px;
            letter-spacing: 2px;
            margin-bottom: 10px;
            font-weight: bold;
            width: 100%;
        }

        .seat-legend {
            display: flex;
            justify-content: center;
            gap: 12px;
            font-size: 11px;
            color: #747d8c;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .legend-color {
            width: 10px;
            height: 10px;
            border-radius: 2px;
        }

        .seating-map-wrapper {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 15px;
            border: 1px dashed var(--border-color);
            border-radius: 8px;
            background: #fafbfc;
            margin-bottom: 10px;
        }

        .seats-container {
            display: flex;
            flex-direction: column;
            gap: 5px;
            align-items: center;
            min-width: 680px;
            padding: 15px 10px;
        }

        .row-group {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .row-group.aisle-gap-bottom-de {
            margin-bottom: 18px;
        }

        .row-label {
            width: 22px;
            font-size: 11px;
            font-weight: bold;
            color: #747d8c;
            text-align: center;
            flex-shrink: 0;
        }

        .row-seats {
            display: flex;
            gap: 4px;
            align-items: center;
            flex-wrap: nowrap;
        }

        .seat {
            width: 24px;
            height: 24px;
            background-color: var(--seat-available);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8px;
            color: #333;
            cursor: pointer;
            user-select: none;
            flex-shrink: 0;
            transition: transform 0.1s, background-color 0.2s;
        }

        .seat:hover:not(.occupied):not(.empty) {
            transform: scale(1.15);
            background-color: #a4b0be;
        }

        .seat.selected {
            background-color: var(--seat-selected) !important;
            color: white !important;
            font-weight: bold;
        }

        .seat.occupied {
            background-color: var(--seat-occupied);
            color: white;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .seat.disabled-chair {
            background-color: var(--seat-disabled);
            color: white;
            font-size: 6px;
            font-weight: bold;
        }

        .seat.empty {
            background-color: transparent;
            cursor: default;
            pointer-events: none;
        }

        .aisle-space {
            width: 10px;
            flex-shrink: 0;
        }

        .selected-seat-display {
            text-align: center;
            margin-top: 10px;
            font-size: 13px;
            font-weight: 600;
            color: #2f3542;
        }

        .scroll-tip {
            text-align: center;
            font-size: 11px;
            color: #a4b0be;
            margin-bottom: 8px;
        }

        .btn {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .record-list {
            list-style: none;
        }

        .record-item {
            background: var(--bg-color);
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        @media(min-width: 600px) {
            .record-item {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }
        }

        .record-info h3 {
            font-size: 14px;
            margin-bottom: 4px;
            color: #2c0b0e;
        }

        .record-info p {
            font-size: 12px;
            color: #747d8c;
            line-height: 1.4;
        }

        .booking-id-tag {
            background: var(--primary-color);
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
        }

        .ticket-qr-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: white;
            padding: 8px;
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            gap: 4px;
        }

        .ticket-qr-box {
            width: 80px;
            height: 80px;
        }

        .save-qr-btn {
            background: #27ae60;
            color: white;
            border: none;
            padding: 4px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 500;
            cursor: pointer;
        }

        .save-qr-btn:hover {
            background: #219653;
        }

        .delete-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            height: fit-content;
        }

        .delete-btn:hover {
            background: #c0392b;
        }

        .empty-tip {
            text-align: center;
            color: #a4b0be;
            font-size: 13px;
            padding: 15px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Chinese Film Week in Oman</h1>
        <p>address: Cinema 5, VOX cinema, Mall of Oman</p>
    </header>

    <div class="card">
        <h2>Please select your movie</h2>
        <form id="bookingForm">
            <div class="form-group">
                <label for="movie">Select Screening Session (Cinema 5)</label>
                <select id="movie" onchange="renderSeats()">
                    <option value="Oct 21 (Wed) 20:10-21:40 | A Tapestry of a Legendary Land">Oct 21 (Wed) 20:10-21:40 - A Tapestry of a Legendary Land《只此青绿》</option>
                    <option value="Oct 22 (Thu) 18:00-19:59 | Dear You">Oct 22 (Thu) 18:00-19:59 - Dear You《给阿嬷的情书》</option>
                    <option value="Oct 22 (Thu) 20:30-22:22 | B for Busy">Oct 22 (Thu) 20:30-22:22 - B for Busy《爱情神话》</option>
                    <option value="Oct 23 (Fri) 17:00-19:53 | The Wandering Earth 2">Oct 23 (Fri) 17:00-19:53 - The Wandering Earth 2《流浪地球2》</option>
                    <option value="Oct 23 (Fri) 20:20-22:33 | I Am What I Am 2">Oct 23 (Fri) 20:20-22:33 - I Am What I Am 2《雄狮少年2》</option>
                    <option value="Oct 24 (Sat) 17:20-19:21 | Crossing">Oct 24 (Sat) 17:20-19:21 - Crossing《四渡》</option>
                    <option value="Oct 24 (Sat) 19:50-22:13 | The Shadow's Edge">Oct 24 (Sat) 19:50-22:13 - The Shadow's Edge《捕风捉影》</option>
                </select>
            </div>

            <div class="form-group">
                <label>Graphical Seating Map (Screen Centered)</label>
                <div class="screen-container">
                    <div class="screen">SCREEN</div>
                    <div class="seat-legend">
                        <div class="legend-item"><div class="legend-color" style="background:var(--seat-available)"></div>Available</div>
                        <div class="legend-item"><div class="legend-color" style="background:var(--seat-selected)"></div>Selected</div>
                        <div class="legend-item"><div class="legend-color" style="background:var(--seat-occupied)"></div>Occupied</div>
                        <div class="legend-item"><div class="legend-color" style="background:var(--seat-disabled)"></div>Disabled (DIS)</div>
                    </div>
                </div>

                <div class="scroll-tip">👉 左右滑动可查看完整座位区域 (Swipe left/right to view all seats)</div>
                <div class="seating-map-wrapper">
                    <div class="seats-container" id="seatsContainer"></div>
                </div>
                
                <div class="selected-seat-display" id="selectedSeatText">Selected Seats: None (Max 5)</div>
            </div>

            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" required placeholder="Enter your full name">
            </div>

            <div class="form-group">
                <label for="nationality">Nationality:</label>
                <select id="nationality" required>
                    <option value="" disabled selected>Select your nationality</option>
                    <option value="Afghanistan">Afghanistan</option>
                    <option value="Albania">Albania</option>
                    <option value="Algeria">Algeria</option>
                    <option value="Argentina">Argentina</option>
                    <option value="Australia">Australia</option>
                    <option value="Austria">Austria</option>
                    <option value="Bahrain">Bahrain</option>
                    <option value="Bangladesh">Bangladesh</option>
                    <option value="Belgium">Belgium</option>
                    <option value="Brazil">Brazil</option>
                    <option value="Canada">Canada</option>
                    <option value="China">China</option>
                    <option value="Denmark">Denmark</option>
                    <option value="Egypt">Egypt</option>
                    <option value="France">France</option>
                    <option value="Germany">Germany</option>
                    <option value="India">India</option>
                    <option value="Indonesia">Indonesia</option>
                    <option value="Iraq">Iraq</option>
                    <option value="Italy">Italy</option>
                    <option value="Japan">Japan</option>
                    <option value="Jordan">Jordan</option>
                    <option value="Kuwait">Kuwait</option>
                    <option value="Lebanon">Lebanon</option>
                    <option value="Malaysia">Malaysia</option>
                    <option value="Morocco">Morocco</option>
                    <option value="Netherlands">Netherlands</option>
                    <option value="New Zealand">New Zealand</option>
                    <option value="Oman">Oman</option>
                    <option value="Pakistan">Pakistan</option>
                    <option value="Philippines">Philippines</option>
                    <option value="Qatar">Qatar</option>
                    <option value="Russia">Russia</option>
                    <option value="Saudi Arabia">Saudi Arabia</option>
                    <option value="Singapore">Singapore</option>
                    <option value="South Africa">South Africa</option>
                    <option value="South Korea">South Korea</option>
                    <option value="Spain">Spain</option>
                    <option value="Sweden">Sweden</option>
                    <option value="Switzerland">Switzerland</option>
                    <option value="Syria">Syria</option>
                    <option value="Tunisia">Tunisia</option>
                    <option value="Turkey">Turkey</option>
                    <option value="United Arab Emirates">United Arab Emirates</option>
                    <option value="United Kingdom">United Kingdom</option>
                    <option value="United States">United States</option>
                    <option value="Yemen">Yemen</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="phone">Phone number: (Max 5 Seats Limit, numbers only, max 15 digits)</label>
                <input type="tel" id="phone" required maxlength="15" oninput="this.value=this.value.replace(/\D/g,'')" placeholder="Enter phone number (numbers only)">
            </div>

            <button type="submit" class="btn">Confirm Booking</button>
        </form>
    </div>

    <div class="card">
        <h2>My Bookings & QR Tickets</h2>
        <ul id="recordList" class="record-list">
            <div class="empty-tip">No bookings found</div>
        </ul>
    </div>
</div>

<script>
    let selectedSeats = [];

    document.addEventListener('DOMContentLoaded', function() {
        renderSeats();
        loadRecords();
    });

    function renderSeats() {
        const container = document.getElementById('seatsContainer');
        container.innerHTML = '';
        selectedSeats = [];
        updateSelectedText();

        const currentMovie = document.getElementById('movie').value;
        const records = JSON.parse(localStorage.getItem('cinema_bookings')) || [];
        
        const occupiedSeats = [];
        records.filter(r => r.movie === currentMovie).forEach(r => {
            if (Array.isArray(r.seats)) occupiedSeats.push(...r.seats);
            else if (r.seat) occupiedSeats.push(r.seat);
        });

        const rowNames = ['M', 'L', 'K', 'J', 'I', 'H', 'G', 'F', 'E', 'D', 'C', 'B', 'A'];

        rowNames.forEach(rowLetter => {
            const rowGroup = document.createElement('div');
            rowGroup.className = 'row-group';
            // 点评要求4：C排与D排直接去除过道（不再加 aisle-gap-bottom-de 间距）

            const label = document.createElement('div');
            label.className = 'row-label';
            label.innerText = rowLetter;
            rowGroup.appendChild(label);

            const rowSeatsDiv = document.createElement('div');
            rowSeatsDiv.className = 'row-seats';

            let endCol = 22;
            if (['M', 'L', 'K', 'J', 'I', 'H', 'G', 'F', 'E'].includes(rowLetter)) endCol = 22;
            else if (['D', 'C', 'B'].includes(rowLetter)) endCol = 21;
            else if (rowLetter === 'A') endCol = 22;

            for (let col = endCol; col >= 1; col--) {
                // 点评要求3：M排座位从12-20更正为13到21 (M排col 1到2为空, 3到21为真实座位, col 22留空或对应索引)
                if (rowLetter === 'M') {
                    if (col === 1 || col === 2 || col > 21) {
                        const emptySeat = document.createElement('div');
                        emptySeat.className = 'seat empty';
                        rowSeatsDiv.appendChild(emptySeat);
                        continue;
                    }
                } else {
                    if (['L', 'K', 'J', 'I', 'H', 'G', 'F'].includes(rowLetter) && (col === 1 || col === 2)) {
                        const emptySeat = document.createElement('div');
                        emptySeat.className = 'seat empty';
                        rowSeatsDiv.appendChild(emptySeat);
                        continue;
                    }
                    if (['M', 'L', 'K', 'J', 'I', 'H', 'G', 'F', 'E'].includes(rowLetter) && col > 21) {
                        const aisle = document.createElement('div');
                        aisle.className = 'aisle-space';
                        rowSeatsDiv.appendChild(aisle);
                        continue;
                    }
                    if (['D', 'C', 'B'].includes(rowLetter) && col > 20) {
                        const aisle = document.createElement('div');
                        aisle.className = 'aisle-space';
                        rowSeatsDiv.appendChild(aisle);
                        continue;
                    }
                }

                if (rowLetter === 'M' && col === 11) {
                    continue;
                }

                const seatName = `${rowLetter}-${col}`;
                const seat = document.createElement('div');
                seat.className = 'seat';

                let isDisabledChair = (rowLetter === 'M' && (col === 9 || col === 10 || col === 12));
                let isForcedOccupied = (rowLetter === 'C' || rowLetter === 'D');
                let displayNum = (rowLetter === 'M' && col > 11) ? col - 1 : col;
                
                if (isDisabledChair) {
                    seat.classList.add('disabled-chair');
                    seat.innerText = 'DIS';
                } else {
                    seat.innerText = displayNum;
                }

                if (occupiedSeats.includes(seatName) || isForcedOccupied) {
                    seat.classList.add('occupied');
                } else {
                    seat.addEventListener('click', function() {
                        if (seat.classList.contains('selected')) {
                            seat.classList.remove('selected');
                            selectedSeats = selectedSeats.filter(s => s !== seatName);
                        } else {
                            if (selectedSeats.length >= 5) {
                                alert('You can book a maximum of 5 seats per reservation!');
                                return;
                            }
                            seat.classList.add('selected');
                            selectedSeats.push(seatName);
                        }
                        updateSelectedText();
                    });
                }

                rowSeatsDiv.appendChild(seat);

                if (col === 2) {
                    const aisle = document.createElement('div');
                    aisle.className = 'aisle-space';
                    rowSeatsDiv.appendChild(aisle);
                }
            }

            rowGroup.appendChild(rowSeatsDiv);
            container.appendChild(rowGroup);
        });
    }

    function updateSelectedText() {
        if (selectedSeats.length === 0) {
            document.getElementById('selectedSeatText').innerText = 'Selected Seats: None (Max 5)';
        } else {
            document.getElementById('selectedSeatText').innerText = `Selected Seats (${selectedSeats.length}/5): ${selectedSeats.join(', ')}`;
        }
    }

    const bookingForm = document.getElementById('bookingForm');
    const recordList = document.getElementById('recordList');

    bookingForm.addEventListener('submit', function(e) {
        e.preventDefault();

        if (selectedSeats.length === 0) {
            alert('Please select at least one seat from the seating chart!');
            return;
        }

        const phone = document.getElementById('phone').value.trim();
        const movie = document.getElementById('movie').value;
        const records = JSON.parse(localStorage.getItem('cinema_bookings')) || [];

        const existingBookingsForPhone = records.filter(r => r.phone === phone && r.movie === movie);
        let existingSeatsCount = 0;
        existingBookingsForPhone.forEach(r => {
            if (Array.isArray(r.seats)) existingSeatsCount += r.seats.length;
            else if (r.seat) existingSeatsCount += 1;
        });

        if (existingSeatsCount + selectedSeats.length > 5) {
            alert(`Booking failed! This phone number has already booked ${existingSeatsCount} seats for this screening. Maximum limit is 5 seats.`);
            return;
        }

        const name = document.getElementById('name').value.trim();
        const nationality = document.getElementById('nationality').value;

        const bookingId = 'FW' + Math.random().toString(36).substring(2, 8).toUpperCase();

        const newRecord = {
            id: Date.now(),
            bookingId,
            name,
            nationality,
            phone,
            movie,
            seats: [...selectedSeats],
            time: new Date().toLocaleString()
        };

        saveRecord(newRecord);
        bookingForm.reset();
        renderSeats();
        loadRecords();
        alert('Booking successful! Your Booking ID is: ' + bookingId);
    });

    function loadRecords() {
        const records = JSON.parse(localStorage.getItem('cinema_bookings')) || [];
        
        if (records.length === 0) {
            recordList.innerHTML = '<div class="empty-tip">No bookings found</div>';
            return;
        }

        recordList.innerHTML = '';
        records.forEach(record => {
            const seatsStr = Array.isArray(record.seats) ? record.seats.join(', ') : record.seat;
            const li = document.createElement('li');
            li.className = 'record-item';
            li.innerHTML = `
                <div class="record-info">
                    <h3>${record.name} (${record.nationality}) <span class="booking-id-tag">ID: ${record.bookingId}</span></h3>
                    <p><strong>[Seats: ${seatsStr}]</strong></p>
                    <p>Screening: ${record.movie}</p>
                    <p>Phone: ${record.phone}</p>
                </div>
                <div class="ticket-qr-container">
                    <div class="ticket-qr-box" id="qr-${record.bookingId}"></div>
                    <button class="save-qr-btn" onclick="saveQRCodeImage('${record.bookingId}', '${record.name}')">💾 Save Ticket</button>
                </div>
                <button class="delete-btn" onclick="deleteRecord(${record.id})">Cancel</button>
            `;
            recordList.appendChild(li);

            new QRCode(document.getElementById(`qr-${record.bookingId}`), {
                text: record.bookingId,
                width: 80,
                height: 80,
                colorDark : "#c0392b",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.M
            });
        });
    }

    function saveQRCodeImage(bookingId, attendeeName) {
        const qrContainer = document.getElementById(`qr-${bookingId}`);
        const canvasEl = qrContainer.querySelector('canvas') || qrContainer.querySelector('img');
        
        if (!canvasEl) {
            alert('QR code not ready yet.');
            return;
        }

        const canvas = document.createElement('canvas');
        canvas.width = 400;
        canvas.height = 480;
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#c0392b';
        ctx.fillRect(0, 0, canvas.width, 85);

        ctx.fillStyle = '#f1c40f';
        ctx.font = 'bold 15px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('Chinese Film Week in Oman', canvas.width / 2, 32);
        
        ctx.fillStyle = '#ffffff';
        ctx.font = '11px Arial';
        ctx.fillText('address: Cinema 5, VOX cinema, Mall of Oman', canvas.width / 2, 60);

        let img = new Image();
        if (canvasEl.tagName === 'CANVAS') {
            img.src = canvasEl.toDataURL('image/png');
        } else {
            img.src = canvasEl.src;
        }

        img.onload = function() {
            ctx.drawImage(img, 110, 105, 180, 180);

            ctx.fillStyle = '#2f3542';
            ctx.font = 'bold 16px Arial';
            ctx.fillText(`Booking ID: ${bookingId}`, canvas.width / 2, 315);

            ctx.font = '13px Arial';
            ctx.fillStyle = '#57606f';
            ctx.fillText(`Attendee: ${attendeeName}`, canvas.width / 2, 345);

            ctx.fillStyle = '#c0392b';
            ctx.font = 'bold 12px Arial';
            ctx.fillText('Please present this QR code at the cinema entrance', canvas.width / 2, 395);

            const link = document.createElement('a');
            link.download = `Ticket_${bookingId}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        };
    }

    function saveRecord(record) {
        const records = JSON.parse(localStorage.getItem('cinema_bookings')) || [];
        records.unshift(record);
        localStorage.setItem('cinema_bookings', JSON.stringify(records));
    }

    function deleteRecord(id) {
        if (confirm('Are you sure you want to cancel this booking?')) {
            let records = JSON.parse(localStorage.getItem('cinema_bookings')) || [];
            records = records.filter(record => record.id !== id);
            localStorage.setItem('cinema_bookings', JSON.stringify(records));
            renderSeats();
            loadRecords();
        }
    }
</script>

</body>
</html>
