<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinese Film Week in Oman - Booking</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#c0392b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --primary-color: #c0392b;
            --primary-hover: #e74c3c;
            --accent-color: #f1c40f;
            --bg-color: #f7f9fc;
            --card-bg: #ffffff;
            --text-color: #2f3542;
            --border-color: #dfe4ea;
            --seat-available: #ced6e0;
            --seat-selected: #2ed573;
            --seat-occupied: #c0392b;
            --seat-disabled: #ffa502;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #2c0b0e 0%, #110203 100%);
            color: var(--text-color);
            padding: 15px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 950px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            color: #fff;
        }

        header h1 {
            font-size: 22px;
            color: var(--accent-color);
            margin-bottom: 6px;
        }

        header p {
            color: #dcdde1;
            font-size: 12px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 18px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
            border-top: 4px solid var(--primary-color);
        }

        .card h2 {
            font-size: 17px;
            margin-bottom: 14px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--bg-color);
            color: #2c0b0e;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
            color: #2f3542;
        }

        input, select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--primary-color);
        }

        .screen-container {
            text-align: center;
            margin-bottom: 12px;
        }

        .screen {
            background: #2c0b0e;
            color: var(--accent-color);
            padding: 6px;
            border-radius: 4px;
            font-size: 12px;
            letter-spacing: 2px;
            margin-bottom: 10px;
            font-weight: bold;
            width: 100%;
        }

        .seat-legend {
            display: flex;
            justify-content: center;
            gap: 12px;
            font-size: 11px;
            color: #747d8c;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .legend-color {
            width: 10px;
            height: 10px;
            border-radius: 2px;
        }

        .seating-map-wrapper {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 15px;
            border: 1px dashed var(--border-color);
            border-radius: 8px;
            background: #fafbfc;
            margin-bottom: 10px;
        }

        .seats-container {
            display: flex;
            flex-direction: column;
            gap: 5px;
            align-items: center;
            min-width: 750px;
            padding: 15px 10px;
        }

        .row-group {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .row-label {
            width: 22px;
            font-size: 11px;
            font-weight: bold;
            color: #747d8c;
            text-align: center;
            flex-shrink: 0;
        }

        .row-seats {
            display: flex;
            gap: 4px;
            align-items: center;
            flex-wrap: nowrap;
        }

        .seat {
            width: 24px;
            height: 24px;
            background-color: var(--seat-available);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8px;
            color: #333;
            cursor: pointer;
            user-select: none;
            flex-shrink: 0;
            transition: transform 0.1s, background-color 0.2s;
        }

        .seat:hover:not(.occupied):not(.empty) {
            transform: scale(1.15);
            background-color: #a4b0be;
        }

        .seat.selected {
            background-color: var(--seat-selected) !important;
            color: white !important;
            font-weight: bold;
        }

        .seat.occupied {
            background-color: var(--seat-occupied);
            color: white;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .seat.disabled-chair {
            background-color: var(--seat-disabled);
            color: white;
            font-size: 6px;
            font-weight: bold;
        }

        .aisle-space {
            width: 12px;
            flex-shrink: 0;
        }

        .row-divider {
            height: 10px;
            width: 100%;
        }

        .selected-seat-display {
            text-align: center;
            margin-top: 10px;
            font-size: 13px;
            font-weight: 600;
            color: #2f3542;
        }

        .scroll-tip {
            text-align: center;
            font-size: 11px;
            color: #a4b0be;
            margin-bottom: 8px;
        }

        .btn {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .search-box-row {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .record-list {
            list-style: none;
        }

        .record-item {
            background: var(--bg-color);
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        @media(min-width: 600px) {
            .record-item {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }
        }

        .record-info h3 {
            font-size: 14px;
            margin-bottom: 4px;
            color: #2c0b0e;
        }

        .record-info p {
            font-size: 12px;
            color: #747d8c;
            line-height: 1.4;
        }

        .booking-id-tag {
            background: var(--primary-color);
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
        }

        .ticket-qr-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: white;
            padding: 8px;
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            gap: 4px;
        }

        .ticket-qr-box {
            width: 80px;
            height: 80px;
        }

        .save-qr-btn {
            background: #27ae60;
            color: white;
            border: none;
            padding: 4px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 500;
            cursor: pointer;
        }

        .save-qr-btn:hover {
            background: #219653;
        }

        .delete-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            height: fit-content;
        }

        .delete-btn:hover {
            background: #c0392b;
        }

        .empty-tip {
            text-align: center;
            color: #a4b0be;
            font-size: 13px;
            padding: 15px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Chinese Film Week in Oman</h1>
        <p>address: Cinema 5, VOX cinema, Mall of Oman</p>
    </header>

    <div class="card">
        <h2>Please select your movie</h2>
        <form id="bookingForm">
            <div class="form-group">
                <label for="movie">Select Screening Session (Cinema 5)</label>
                <select id="movie" onchange="renderSeats()">

                    <option value="Oct 22 (Thu) 18:00-20:01 | Crossing">Oct 22 (Thu) 18:00-20:01 - Crossing《四渡》</option>
                    <option value="Oct 22 (Thu) 20:30-22:22 | B for Busy">Oct 22 (Thu) 20:30-22:22 - B for Busy《爱情神话》</option>
                    <option value="Oct 23 (Fri) 17:00-19:53 | The Wandering Earth 2">Oct 23 (Fri) 17:00-19:53 - The Wandering Earth 2《流浪地球2》</option>
                    <option value="Oct 23 (Fri) 20:20-22:33 | I Am What I Am 2">Oct 23 (Fri) 20:20-22:33 - I Am What I Am 2《雄狮少年2》</option>
                    <option value="Oct 24 (Sat) 17:20-19:19 | Dear You">Oct 24 (Sat) 17:20-19:19 - Dear You《给阿嬷的情书》</option>
                    <option value="Oct 24 (Sat) 19:50-22:13 | The Shadow's Edge">Oct 24 (Sat) 19:50-22:13 - The Shadow's Edge《捕风捉影》</option>
                </select>
            </div>

            <div class="form-group">
                <label>Graphical Seating Map (Screen Centered)</label>
                <div class="screen-container">
                    <div class="screen">SCREEN 5</div>
                    <div class="seat-legend">
                        <div class="legend-item"><div class="legend-color" style="background:var(--seat-available)"></div>Available</div>
                        <div class="legend-item"><div class="legend-color" style="background:var(--seat-selected)"></div>Selected</div>
                        <div class="legend-item"><div class="legend-color" style="background:var(--seat-occupied)"></div>Occupied / Reserved (C & D)</div>
                        <div class="legend-item"><div class="legend-color" style="background:var(--seat-disabled)"></div>Disable</div>
                    </div>
                </div>

                <div class="scroll-tip">👉 左右滑动可查看完整座位区域 (Swipe left/right to view all seats)</div>
                <div class="seating-map-wrapper">
                    <div class="seats-container" id="seats
