<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinese Film Week in Oman - Booking</title>
    <meta name="theme-color" content="#c0392b">
    <style>
        :root {
            --primary-color: #c0392b;
            --accent-color: #f1c40f;
            --card-bg: #ffffff;
            --text-color: #2f3542;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #2c0b0e 0%, #110203 100%);
            color: var(--text-color);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        header {
            margin-bottom: 25px;
            color: #fff;
        }

        header h1 {
            font-size: 24px;
            color: var(--accent-color);
            margin-bottom: 8px;
        }

        header p {
            color: #dcdde1;
            font-size: 13px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 40px 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border-top: 5px solid var(--primary-color);
        }

        .notice-cn {
            font-size: 20px;
            font-weight: bold;
            color: #2c0b0e;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .notice-en {
            font-size: 18px;
            font-weight: 600;
            color: #c0392b;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Chinese Film Week in Oman</h1>
        <p>address: Cinema 5, VOX cinema, Mall of Oman</p>
    </header>

    <div class="card">
        <div class="notice-cn">票已订完，谢谢您对中国电影的喜爱！</div>
        <div class="notice-en">Tickets are fully booked. Thank you!</div>
    </div>
</div>

</body>
</html>
